# [file name]: config/orchestrator_config.yaml
orchestrator:
  system_id: "ml_orchestrator_v1"
  auto_initialize: true
  health_check_interval: 30
  
components:
  models:
    - "enhanced_predictor_v2"
    - "statistical_predictor"
    - "pattern_predictor"
    - "frequency_predictor"
    - "weighted_ensemble_v1"
  
  feature_engineers:
    - "statistical"
    - "advanced"
  
  ensemble_predictors:
    - "statistical"
    - "pattern_based" 
    - "frequency"
    - "weighted_ensemble"

# 🔧 ДОБАВЛЕН DATA PROCESSING
data_processing:
  processor:
    class: "ml.data.processors.data_processor.ModularDataProcessor"
    params:
      history_size: 20
      feature_engineers: ["statistical", "advanced"]
  
  dataset_manager:
    dataset_path: "/opt/model/data/datasets/dataset.json"

logging:
  level: "DEBUG"
  enable_component_logs: true
